name: Deploy Ponder Source app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pondersource/savr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci
      - run: npm test -- --runInBand
      - run: npm run build:prod
        env:
          VITE_CORS_PROXY: ""
      - name: Prepare custom domain and client routes
        run: |
          printf '%s\n' 'savr.pondersource.com' > dist/CNAME
          cp dist/index.html dist/404.html
          cp -R atomic dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
